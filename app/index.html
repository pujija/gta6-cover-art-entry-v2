<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City Cover Studio — GTA 6-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice City<br>Cover Studio</h1>
    <p class="tag">Turn your photos into GTA-style cover art. Pick a layout, a grade and a size, frame each panel, then export a PNG.</p>

    <fieldset>
      <legend>Layout</legend>
      <div class="row" id="layouts"></div>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div class="row" id="grades"></div>
    </fieldset>

    <fieldset>
      <legend>Size</legend>
      <div class="row" id="sizes"></div>
    </fieldset>

    <fieldset>
      <legend>Words</legend>
      <label>Title <input id="title" type="text" maxlength="32" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="A Leonida Story"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="48" value="Coming soon"></label>
    </fieldset>

    <fieldset>
      <legend>Photos <span class="hint">click a panel, then drag to pan, scroll to zoom</span></legend>
      <div class="slots" id="slots"></div>
      <div class="row">
        <label class="upload">Upload a photo <input id="upload" type="file" accept="image/*"></label>
        <button id="fillall" type="button">Fill all with this photo</button>
      </div>
      <p class="hint" id="selectedLabel"></p>
    </fieldset>

    <div class="row">
      <button id="export" type="button" class="primary">Export PNG</button>
      <button id="reset" type="button">Reset framing</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
